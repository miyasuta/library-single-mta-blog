specVersion: "4.0"
metadata:
  name: miyasuta.library
type: library
framework:
  name: SAPUI5
  version: 1.154.0
  libraries:
    - name: sap.ui.core
    - name: themelib_sap_horizon
    - name: themelib_sap_fiori_3
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        coverage: true
    - name: ui5-middleware-livereload
      afterMiddleware: compression
